name: Daily Check-in

on:
  schedule:
    # 每天北京时间 00:00 执行（UTC 16:00 前一日）
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Appium server and UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install Chromium for Playwright (for anti-bot APK hosts)
        run: python -m playwright install chromium

      - name: Enable KVM hardware acceleration
        run: |
          # GitHub ubuntu runner 的 runner 用户默认不在 kvm 组，导致 /dev/kvm 无权限、
          # 模拟器被迫走纯软件模拟(-accel off)而启动超时。放开权限后即可用 KVM 硬件加速。
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660"' | sudo tee /etc/udev/rules.d/50-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run check-in on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            # 1) 确认模拟器已被 adb 识别、且启动完成
            # （防御 5037 adb 连接异常导致设备不可见：打出设备列表 + 轮询 boot_completed）
            adb wait-for-device
            adb devices -l || true
            for i in $(seq 1 30); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                echo "模拟器启动完成"
                break
              fi
              sleep 5
            done
            echo "boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"

            # 2) 启动 Appium 并轮询就绪（用轮询代替固定 sleep，避免启动慢时连接失败）
            appium --address 127.0.0.1 --port 4723 --log-level error > /tmp/appium.log 2>&1 &
            for i in $(seq 1 30); do
              if curl -s http://127.0.0.1:4723/status >/dev/null 2>&1; then
                echo "Appium 已就绪"
                break
              fi
              sleep 2
            done
            curl -s http://127.0.0.1:4723/status | head -c 300 || true
            echo

            # 3) 运行签到脚本
            python checkin.py
        env:
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          APK_DOWNLOAD_URL: ${{ secrets.APK_DOWNLOAD_URL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_DOMAIN: ${{ secrets.QINIU_DOMAIN }}
          MAX_RETRIES: ${{ vars.MAX_RETRIES || '2' }}
          SCREENSHOT_BASE_URL: ${{ secrets.SCREENSHOT_BASE_URL }}
          APK_PATH: /tmp/app.apk
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/**
